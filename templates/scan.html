<!DOCTYPE html>
<html>
<head>
<title>Live Threat Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0b0f19;
color:#e6edf3;
overflow:hidden;
}

/* HEADER CARD */
.card{
margin:20px auto;
width:80%;
padding:20px;
background:#111827;
border-radius:12px;
border:1px solid #1f2937;
text-align:center;
box-shadow:0 0 20px rgba(88,166,255,0.15);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
width:85%;
margin:auto;
}

/* BOX */
.box{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2937;
}

/* LIVE PULSE */
.pulse{
width:10px;
height:10px;
background:red;
border-radius:50%;
display:inline-block;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.2;}
}

/* SCORE */
.score{
font-size:40px;
color:#58a6ff;
}

.status{
font-size:20px;
margin-top:10px;
}

</style>

</head>

<body>

<div class="card">
<h2>⚡ Live Threat Scanner</h2>
<p><span class="pulse"></span> Real-time SOC Monitoring Active</p>

<h3 id="url">URL: -</h3>
<div class="status" id="status">STATUS: -</div>
<div class="score" id="score">0</div>
<h4 id="time"></h4>
</div>

<div class="grid">

<!-- GRAPH -->
<div class="box">
<h3>📊 Threat Score Timeline</h3>
<canvas id="chart"></canvas>
</div>

<!-- EVENT LOG -->
<div class="box">
<h3>🔥 Live SOC Events</h3>
<div id="events" style="height:300px;overflow:auto;"></div>
</div>

</div>

<script>

let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Threat Score',
            data: [],
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88,166,255,0.1)',
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                min: 0,
                max: 100
            }
        }
    }
});

function addEvent(msg){
    let div = document.createElement("div");
    div.innerHTML = "🛡 " + msg;
    div.style.padding = "5px";
    div.style.borderBottom = "1px solid #1f2937";
    document.getElementById("events").prepend(div);
}

function scan(){

fetch("/api/continuous-scan")
.then(r => r.json())
.then(data => {

    // UI update
    document.getElementById("url").innerText = "URL: " + data.url;
    document.getElementById("status").innerText = "STATUS: " + data.status;
    document.getElementById("score").innerText = data.score;
    document.getElementById("time").innerText = data.time;

    // GRAPH update
    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(data.score);

    // keep last 15 points only
    if(chart.data.labels.length > 15){
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();

    // EVENT LOG
    addEvent(data.event);

});

}

setInterval(scan, 1500);
scan();

</script>

</body>
</html>
