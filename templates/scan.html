<!DOCTYPE html>
<html>
<head>
<title>Live Scan</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0b0f19;color:white;font-family:Segoe UI;}
.card{padding:20px;margin:20px;background:#111827;border-radius:10px;}
.box{padding:20px;background:#111827;margin:10px;border-radius:10px;}
</style>
</head>

<body>

<div class="card">
<h2>⚡ LIVE SCAN</h2>
<h3 id="status">STATUS: -</h3>
<h1 id="score">0</h1>
<h4 id="time"></h4>
</div>

<div class="box">
<canvas id="chart"></canvas>
</div>

<div class="box">
<h3>EVENTS</h3>
<div id="events"></div>
</div>

<script>

let chart = new Chart(document.getElementById("chart"), {
type:"line",
data:{
labels:[],
datasets:[{label:"Score",data:[],borderColor:"red"}]
},
options:{animation:false}
});

function getStatus(s){
if(s<30) return "SAFE";
if(s<50) return "MEDIUM";
if(s<60) return "THREAT";
return "HIGH";
}

function add(e){
let d=document.createElement("div");
d.innerHTML=e;
document.getElementById("events").prepend(d);
}

function scan(){

fetch("/api/continuous-scan")
.then(r=>r.json())
.then(d=>{

document.getElementById("score").innerText=d.score;
document.getElementById("status").innerText=getStatus(d.score);
document.getElementById("time").innerText=d.time;

chart.data.labels.push(d.time);
chart.data.datasets[0].data.push(d.score);

if(chart.data.labels.length>15){
chart.data.labels.shift();
chart.data.datasets[0].data.shift();
}

chart.update();
add(d.event);
});
}

setInterval(scan,1000);
</script>

</body>
