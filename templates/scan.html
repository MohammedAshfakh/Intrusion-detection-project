<!DOCTYPE html>
<html>
<head>
<title>Live Threat Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ================= BASE ================= */
body{
margin:0;
font-family:Segoe UI;
background:#0b0f19;
color:#e6edf3;
overflow-x:hidden;
}

/* ================= NAV ================= */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 18px;
background:#111827;
border-bottom:1px solid #1f2937;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
color:#58a6ff;
text-decoration:none;
margin-right:12px;
font-weight:600;
padding:6px 10px;
border-radius:6px;
}

.navbar a:hover{
background:#238636;
color:white;
}

/* ACTIVE PAGE */
.active{
background:#58a6ff !important;
color:white !important;
}

/* ================= HEADER CARD ================= */
.card{
margin:20px auto;
width:85%;
padding:20px;
background:#111827;
border-radius:12px;
border:1px solid #1f2937;
text-align:center;
box-shadow:0 0 20px rgba(88,166,255,0.15);
}

/* ================= GRID ================= */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
width:85%;
margin:auto;
}

/* ================= BOX ================= */
.box{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2937;
}

/* ================= LIVE PULSE ================= */
.pulse{
width:10px;
height:10px;
background:red;
border-radius:50%;
display:inline-block;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.2;}
}

/* ================= TEXT ================= */
.score{
font-size:40px;
color:#58a6ff;
}

.status{
font-size:20px;
margin-top:10px;
}

/* ================= EVENT LOG ================= */
#events{
height:300px;
overflow-y:auto;
border:1px solid #1f2937;
padding:10px;
border-radius:8px;
background:#0b0f19;
}

#events div{
padding:6px;
border-bottom:1px solid #1f2937;
font-size:13px;
}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/scan">Live Scan</a>
    <a href="/analytics">Analytics</a>
    <a href="/about">About</a>
  </div>

  <div>
    <a href="/logout">Logout</a>
  </div>
</nav>

<!-- ================= HEADER ================= -->
<div class="card">
<h2>⚡ Live Threat Scanner</h2>
<p><span class="pulse"></span> Real-time SOC Monitoring Active</p>

<h3 id="url">URL: -</h3>
<div class="status" id="status">STATUS: -</div>
<div class="score" id="score">0</div>
<h4 id="time"></h4>
</div>

<!-- ================= GRID ================= -->
<div class="grid">

<!-- GRAPH -->
<div class="box">
<h3>📊 Threat Score Timeline</h3>
<canvas id="chart"></canvas>
</div>

<!-- EVENTS -->
<div class="box">
<h3>🔥 Live SOC Events</h3>
<div id="events"></div>
</div>

</div>

<script>

let ctx = document.getElementById('chart').getContext('2d');

let chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Threat Score',
            data: [],
            borderColor: '#58a6ff',
            backgroundColor: 'rgba(88,166,255,0.1)',
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        animation: false,
        scales: {
            y: {
                min: 0,
                max: 100
            }
        }
    }
});

/* ================= EVENT ================= */
function addEvent(msg){
    if(!msg) return;

    let div = document.createElement("div");
    div.innerHTML = "🛡 " + msg;
    document.getElementById("events").prepend(div);
}

/* ================= SCAN ================= */
function scan(){

fetch("/api/continuous-scan")
.then(r => r.json())
.then(data => {

    data = data || {};

    document.getElementById("url").innerText = "URL: " + (data.url || "-");
    document.getElementById("status").innerText = "STATUS: " + (data.status || "-");
    document.getElementById("score").innerText = data.score || 0;
    document.getElementById("time").innerText = data.time || "";

    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(data.score || 0);

    if(chart.data.labels.length > 15){
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
    }

    chart.update();

    addEvent(data.event || "Live scan update received");

});

}

setInterval(scan, 1500);
scan();

</script>

<!-- ACTIVE PAGE HIGHLIGHT -->
<script>
const path = window.location.pathname;

document.querySelectorAll(".navbar a").forEach(a => {
    if(a.getAttribute("href") === path){
        a.classList.add("active");
    }
});
</script>

</body>
</html>
