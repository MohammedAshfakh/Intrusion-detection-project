<!DOCTYPE html>
<html>
<head>
<title>Live Threat Scanner</title>

<style>

body{
margin:0;
background:#0b0f19;
color:#e6edf3;
font-family:Segoe UI;
overflow:hidden;
}

/* ANIMATED BACKGROUND */
.bg{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle,#1f2937,#0b0f19);
animation:move 6s infinite alternate;
z-index:-1;
}

@keyframes move{
from{filter:hue-rotate(0deg);}
to{filter:hue-rotate(40deg);}
}

/* CARD */
.card{
margin:60px auto;
width:60%;
padding:25px;
background:#111827;
border-radius:12px;
border:1px solid #1f2937;
box-shadow:0 0 20px rgba(88,166,255,0.2);
text-align:center;
}

/* LIVE PULSE */
.pulse{
width:12px;
height:12px;
background:red;
border-radius:50%;
display:inline-block;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.2;}
}

.status{
font-size:22px;
margin-top:10px;
}

.score{
font-size:40px;
color:#58a6ff;
margin-top:10px;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

<h2>⚡ Live Threat Scanner</h2>

<p><span class="pulse"></span> Scanning in real-time...</p>

<h3 id="url">URL: -</h3>
<div class="status" id="status">STATUS: -</div>
<div class="score" id="score">0</div>
<h4 id="time"></h4>

</div>

<script>

function scan(){

fetch("/api/continuous-scan")
.then(r=>r.json())
.then(data=>{

document.getElementById("url").innerText = "URL: " + data.url;
document.getElementById("status").innerText = "STATUS: " + data.status;
document.getElementById("score").innerText = data.score;
document.getElementById("time").innerText = data.time;

});

}

setInterval(scan, 1500);
scan();

</script>

</body>
</html>
