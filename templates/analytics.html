<!DOCTYPE html>
<html>
<head>
<title>Cyber Threat Analytics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@media(max-width:768px){
.nav-links{
    display:none;
    flex-direction:column;
}
}
/* ================= BASE ================= */
body{
margin:0;
font-family:'Segoe UI';
background:#0b0f19;
color:white;
overflow-x:hidden;
}

/* ================= NAV ================= */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 18px;
background:#111827;
border-bottom:1px solid #1f2937;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
color:#58a6ff;
text-decoration:none;
margin-right:12px;
font-weight:600;
padding:6px 10px;
border-radius:6px;
}

.navbar a:hover{
background:#238636;
color:white;
}

/* ACTIVE PAGE */
.active{
background:#58a6ff !important;
color:white !important;
}

/* ================= LAYOUT ================= */
.container{
width:95%;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

/* ================= CARD ================= */
.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2937;
}

/* BIG NUMBER */
.big{
font-size:42px;
color:#58a6ff;
font-weight:bold;
}

/* LIST */
.list p{
padding:6px;
border-bottom:1px solid #1f2937;
}

/* CHART */
canvas{
background:#0b0f19;
padding:10px;
border-radius:10px;
width:100% !important;
height:300px !important;
}

/* SCROLL FIX */
.scroll-box{
max-height:80vh;
overflow-y:auto;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:#111827;
}

.nav-links{
display:flex;
gap:15px;
}

.nav-links a{
color:#58a6ff;
text-decoration:none;
}

.menu-btn{
display:none;
background:none;
border:none;
font-size:28px;
color:white;
cursor:pointer;
}

/* ================= MOBILE FIX FOR INTELLIGENT HUB ================= */

@media(max-width:768px){

.container{
    width: 95%;
    padding: 10px;
}

.grid{
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card{
    padding: 15px;
    border-radius: 10px;
}

h1, h2, h3{
    font-size: 18px;
}

table{
    width: 100%;
    font-size: 13px;
}

canvas{
    width: 100% !important;
    height: auto !important;
}

.stats-box{
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.geo-item{
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #1f2937;
    font-size: 13px;
}
}

canvas {
    max-width: 100%;
}

.nav-links.show{
    display:flex;
    flex-direction:column;
    position:absolute;
    top:60px;
    right:10px;
    background:#111827;
    padding:10px;
    border:1px solid #1f2937;
    border-radius:10px;
    width:200px;
}

</style>

</head>
<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("show");
}
</script>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
<div class="logo">🛡 AI SOC</div>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div id="mobileMenu" class="nav-links">
<a href="/">Control Panel</a>
<a href="/dashboard">Security Dashboard</a>
<a href="/scan">Threat Scanner</a>
<a href="/analytics">Intelligence Hub</a>
<a href="/about">Documentation</a>
</div>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container scroll-box">

<h2>🌍 SOC Threat Intelligence Dashboard</h2>

<div class="grid">

<!-- LEFT -->
<div class="card">
<h3>📊 Total Website Hits</h3>
<div class="big" id="hits">0</div>

<h3>🌍 Traffic Source (Simulated Geo)</h3>
<div class="list" id="countries"></div>
</div>

<!-- RIGHT -->
<div class="card">
<h3>📈 Traffic Trend</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
let labels = [];
let values = [];

let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
type: "line",
data: {
labels: labels,
datasets: [{
label: "Hits per interval",
data: values,
borderColor: "#2ea043",
tension: 0.3
}]
},
options: {
animation: false,
responsive: true,
scales: {
y: { beginAtZero: true }
}
}
});

function load(){
fetch("/api/analytics")
.then(r => r.json())
.then(data => {

data = data || {};

document.getElementById("hits").innerText = data.total_hits || 0;

let countries = data.countries || {};
let html = "";

for(let c in countries){
html += `<p>📍 ${c} → ${countries[c]}</p>`;
}

document.getElementById("countries").innerHTML = html;

/* CHART UPDATE */
labels.push(new Date().toLocaleTimeString());
values.push(data.total_hits || 0);

if(labels.length > 20){
labels.shift();
values.shift();
}

chart.update();

});
}

load();
setInterval(load, 2000);
</script>

<!-- ACTIVE PAGE HIGHLIGHT -->

<script>
const path = window.location.pathname;

document.querySelectorAll(".nav-links a").forEach(a => {
    if (a.getAttribute("href") === path) {
        a.style.background = "#238636";
        a.style.color = "white";
        a.style.borderRadius = "6px";
        a.style.padding = "6px 10px";
    }
});
</script>

</body>
</html>
