<!DOCTYPE html>
<html>
<head>
<title>Cyber Threat Analytics</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
margin:0;
font-family:'Segoe UI';
background:#0b0f19;
color:white;
}

/* NAV */
nav{
display:flex;
gap:15px;
padding:15px;
background:#111827;
border-bottom:1px solid #1f2937;
}

nav a{
color:#58a6ff;
text-decoration:none;
font-weight:600;
}

/* GRID */
.container{
width:95%;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

/* CARD */
.card{
background:#111827;
padding:20px;
border-radius:12px;
border:1px solid #1f2937;
}

/* BIG NUMBERS */
.big{
font-size:40px;
color:#58a6ff;
}

/* LIST */
.list p{
padding:6px;
border-bottom:1px solid #1f2937;
}

/* CHART BOX */
canvas{
background:#0b0f19;
padding:10px;
border-radius:10px;
}

</style>

</head>

<body>

<nav>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/scan">Live Scan</a>
<a href="/analytics">Analytics</a>
</nav>

<div class="container">

<h2>🌍 SOC Threat Intelligence Dashboard</h2>

<div class="grid">

<!-- LEFT: STATS -->
<div class="card">
<h3>📊 Total Website Hits</h3>
<div class="big" id="hits">0</div>

<h3>🌍 Traffic Source (Simulated Geo)</h3>
<div class="list" id="countries"></div>
</div>

<!-- RIGHT: LIVE CHART -->
<div class="card">
<h3>📈 Traffic Trend</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let labels = [];
let values = [];

let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
type: "line",
data: {
labels: labels,
datasets: [{
label: "Hits per interval",
data: values,
borderColor: "#2ea043",
fill: false,
tension: 0.3
}]
},
options: {
animation: false,
scales: {
y: { beginAtZero: true }
}
}
});

function load(){

fetch("/api/analytics")
.then(r=>r.json())
.then(data=>{

// hits
document.getElementById("hits").innerText = data.total_hits || 0;

// countries
let html = "";
for(let c in (data.countries || {})){
html += `<p>📍 ${c} → ${data.countries[c]}</p>`;
}
document.getElementById("countries").innerHTML = html;

// update chart
labels.push(new Date().toLocaleTimeString());
values.push(data.total_hits || 0);

if(labels.length > 20){
labels.shift();
values.shift();
}

chart.update();

});

}

setInterval(load, 2000);
load();

</script>

</body>
</html>
