<body>

<nav>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/analytics">Analytics</a>
</nav>

<div class="card">

<h2>🌍 Website Traffic Intelligence</h2>

<h3>Total Hits: <span id="hits">0</span></h3>

<h3>Traffic Distribution</h3>
<div id="countries"></div>

</div>

<script>

function load(){

fetch("/api/analytics")
.then(r=>r.json())
.then(data=>{

document.getElementById("hits").innerText = data.total_hits || 0;

let html = "";

for(let c in data.countries || {}){
html += `<p>📍 ${c} : ${data.countries[c]}</p>`;
}

document.getElementById("countries").innerHTML = html;

});

}

setInterval(load, 2000);
load();

</script>

</body>
