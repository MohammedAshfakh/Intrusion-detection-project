<!DOCTYPE html>
<html>
<head>
<title>AI SOC Security Center</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI';
background:#0b0f19;
color:#e6edf3;
}

nav{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:#111827;
border-bottom:1px solid #1f2937;
}

nav a{
color:#58a6ff;
margin-right:12px;
text-decoration:none;
font-weight:600;
}

.container{width:95%;margin:auto;padding:20px;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.card{
background:#111827;
border:1px solid #1f2937;
padding:20px;
border-radius:12px;
}

input{
width:70%;
padding:10px;
border-radius:6px;
border:1px solid #374151;
background:#0b0f19;
color:white;
}

button{
padding:10px 14px;
background:#238636;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.feed{
height:320px;
overflow:auto;
background:#0b0f19;
border:1px solid #1f2937;
padding:10px;
border-radius:10px;
}

.log{padding:6px;margin:5px 0;font-size:13px;border-radius:6px;}
.safe{background:#052e16;border-left:4px solid #22c55e;}
.threat{background:#3b0a0a;border-left:4px solid #ef4444;}

#score{
font-size:50px;
color:#58a6ff;
}
</style>
</head>

<body>

<nav>
<div>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/scan">Live Scan</a>
<a href="/analytics">Analytics</a>
<a href="/about">About</a>
</div>
</nav>

<div class="container">

<div class="card">
<h2>🛡 AI Security Operations Center</h2>

<h1 id="score">0%</h1>
<div id="badge"></div>

<input id="url" placeholder="Enter URL (google.com)">
<button onclick="analyze()">Scan</button>

<p id="result"></p>
</div>

<div class="grid">

<div class="card">
<h3>🔥 Live Feed</h3>
<div class="feed" id="feed"></div>
</div>

<div class="card">
<h3>📊 Threat Graph</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script>

let currentURL = "active";
let feedStarted = false;

/* ================= CHART ================= */
let labels = [];
let values = [];

let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
type: "line",
data: {
labels: labels,
datasets: [{
label: "Threat Score",
data: values,
borderColor: "#ff4d4d",
tension: 0.3,
fill: false
}]
},
options: {
animation: false,
scales: {
y: { min: 0, max: 100 }
}
}
});


/* ================= ANALYZE ================= */
function analyze(){

let url = document.getElementById("url").value;
currentURL = url || "active";

fetch("/api/analyze?url=" + encodeURIComponent(url))
.then(r => r.json())
.then(data => {

document.getElementById("score").innerText = data.score + "%";

let badge = document.getElementById("badge");

badge.innerHTML = `<b>${data.status}</b>`;

/* issues */
let html = "";
if (data.issues && data.issues.length) {
html += "<b>Issues:</b><ul>";
data.issues.forEach(i => html += `<li>${i}</li>`);
html += "</ul>";
}
document.getElementById("result").innerHTML = html;

/* start feed */
if (!feedStarted) {
feedStarted = true;
setInterval(feed, 1000);
}
});
}


/* ================= LIVE FEED ================= */
function feed(){

// ❌ REMOVED BLOCKING CONDITION (MAIN BUG FIX)
// if(!currentURL) return;

fetch("/api/live-event")
.then(r => r.json())
.then(data => {

let div = document.createElement("div");

div.className = data.status.includes("HIGH") ? "log threat" : "log safe";

div.innerText = `[${data.time}] ${data.event}`;

document.getElementById("feed").prepend(div);

/* graph update */
let score = data.score;

labels.push(new Date().toLocaleTimeString());
values.push(score);

if(labels.length > 25){
labels.shift();
values.shift();
}

chart.update();
});
}

</script>
</body>
</html>
