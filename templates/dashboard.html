<!DOCTYPE html>
<html>
<head>
<title>Security Command Center</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0d1117;
color:#e6edf3;
}

nav{
padding:15px;
text-align:center;
background:#161b22;
border-bottom:1px solid #30363d;
}

nav a{
color:#58a6ff;
margin:10px;
text-decoration:none;
font-weight:bold;
}

.container{
width:95%;
margin:auto;
padding:20px;
}

/* INPUT CARD */
.card{
background:#161b22;
padding:20px;
border-radius:12px;
border:1px solid #30363d;
margin-bottom:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* INPUT */
input{
width:75%;
padding:10px;
border-radius:6px;
border:1px solid #30363d;
background:#0d1117;
color:white;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
background:#238636;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#2ea043;
}

/* RESULT */
.result-box{
margin-top:15px;
padding:15px;
border-radius:10px;
background:#0d1117;
border:1px solid #30363d;
text-align:center;
}

.result-safe{color:#2ea043;font-weight:bold;}
.result-medium{color:#d29922;font-weight:bold;}
.result-high{color:#f85149;font-weight:bold;}

/* FEED */
.feed{
height:320px;
overflow:auto;
background:#0d1117;
padding:10px;
border-radius:10px;
border:1px solid #30363d;
}

.log{
padding:6px;
margin:5px 0;
border-radius:6px;
font-size:13px;
}

.safe{background:#033a16;border-left:4px solid #2ea043;}
.threat{background:#5a1e1e;border-left:4px solid #f85149;}

/* CHART */
canvas{
width:100% !important;
height:300px !important;
}

</style>

</head>

<body>

<nav>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/about">About</a>
<a href="/login">Login</a>
<a href="/register">Register</a>
</nav>

<div class="container">

<h2>🛡 AI Website Security Command Center</h2>

<!-- INPUT -->
<div class="card">

<input id="url" placeholder="Enter website URL (https://example.com)">
<button onclick="analyzeURL()">Analyze</button>

<div id="resultText"></div>

</div>

<!-- GRID -->
<div class="grid">

<!-- LIVE FEED -->
<div class="card">
<h3>🔥 Live Threat Feed</h3>
<div id="feed" class="feed"></div>
</div>

<!-- CHART -->
<div class="card">
<h3>📊 Risk Distribution</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script>

let chart;

// INIT CHART (BAR)
function initChart(){

chart = new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["SAFE","MEDIUM","HIGH"],
datasets:[{
data:[0,0,0],
backgroundColor:["#2ea043","#d29922","#f85149"]
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
y:{beginAtZero:true}
}
}
});

}

initChart();


// ==========================
// SHOW RESULT
// ==========================

function showResult(data){

let cls = "";

if(data.status === "SAFE") cls = "result-safe";
else if(data.status === "MEDIUM RISK") cls = "result-medium";
else cls = "result-high";

document.getElementById("resultText").innerHTML = `
<div class="result-box">
<h3 class="${cls}">${data.status}</h3>
<p>Risk Score: ${data.score}/100</p>
</div>
`;

}

// ==========================
// ANALYZE URL
// ==========================

function analyzeURL(){

let url = document.getElementById("url").value;

fetch("/api/analyze?url=" + encodeURIComponent(url))
.then(res => res.json())
.then(data => {

showResult(data);

// reset chart
let safe=0,med=0,high=0;

if(data.status==="SAFE") safe=1;
else if(data.status==="MEDIUM RISK") med=1;
else high=1;

chart.data.datasets[0].data=[safe,med,high];
chart.update();

});

}


// ==========================
// LIVE FEED
// ==========================

function addEvent(){

fetch("/api/live-event")
.then(res => res.json())
.then(data => {

let div = document.createElement("div");
div.classList.add("log");

if(data.type==="safe"){
div.classList.add("safe");
div.innerText = "🟢 " + data.time + " - " + data.message;
}else{
div.classList.add("threat");
div.innerText = "🔴 " + data.time + " - " + data.message;
}

document.getElementById("feed").prepend(div);

});

}

setInterval(addEvent, 1000);

</script>

</body>
</html>
