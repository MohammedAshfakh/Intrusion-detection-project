<!DOCTYPE html>
<html>
<head>
<title>Security Command Center</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0d1117;
color:#e6edf3;
}

nav{
padding:15px;
text-align:center;
background:#161b22;
}

nav a{
color:#58a6ff;
margin:10px;
text-decoration:none;
font-weight:bold;
}

.container{
width:95%;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#161b22;
padding:20px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

input{
width:80%;
padding:10px;
border:none;
border-radius:6px;
margin-right:10px;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
background:#238636;
color:white;
cursor:pointer;
}

.feed{
height:300px;
overflow:auto;
background:#0d1117;
padding:10px;
border-radius:10px;
border:1px solid #30363d;
}

.log{
padding:6px;
margin:5px 0;
font-size:13px;
border-radius:5px;
}

.safe{background:#033a16;}
.threat{background:#5a1e1e;}

.badge{
padding:10px;
border-radius:8px;
display:inline-block;
font-weight:bold;
}

.safe-badge{background:#238636;}
.medium-badge{background:#9e6a03;}
.high-badge{background:#da3633;}

canvas{
width:100% !important;
height:250px !important;
}

</style>

</head>

<body>

<nav>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/about">About</a>
<a href="/login">Login</a>
<a href="/register">Register</a>
</nav>

<div class="container">

<h2>🛡 AI Website Security Command Center</h2>

<!-- INPUT -->
<div class="card">

<input id="url" placeholder="Enter website URL (https://example.com)">
<button onclick="analyzeURL()">Analyze</button>

<p id="resultText"></p>

</div>

<!-- GRID -->
<div class="grid">

<!-- LIVE FEED -->
<div class="card">
<h3>🔥 Live Threat Feed</h3>
<div id="feed" class="feed"></div>
</div>

<!-- THREAT SCORE -->
<div class="card">
<h3>📊 Threat Score</h3>

<h1 id="score">--</h1>
<div id="status" class="badge">Waiting...</div>

<canvas id="chart"></canvas>

</div>

</div>

</div>

<script>

let chartData = [50,55,52,60,58];

let chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:["","","","",""],
datasets:[{
data:chartData,
borderColor:"#58a6ff",
tension:0.4,
pointRadius:0
}]
},
options:{
plugins:{legend:{display:false}},
scales:{x:{display:false},y:{display:false}}
}
});

// ===============================
// ANALYZE URL
// ===============================

function analyzeURL(){

let url = document.getElementById("url").value;

fetch("/api/analyze?url=" + encodeURIComponent(url))
.then(res => res.json())
.then(data => {

document.getElementById("score").innerText = data.score;
document.getElementById("resultText").innerText =
"Result: " + data.status;

// badge color
let badge = document.getElementById("status");

badge.className = "badge";

if(data.status == "SAFE"){
badge.classList.add("safe-badge");
}
else if(data.status == "MEDIUM RISK"){
badge.classList.add("medium-badge");
}
else{
badge.classList.add("high-badge");
}

badge.innerText = data.status;

});
}

// ===============================
// LIVE FEED (every 1 sec)
// ===============================

function addEvent(){

fetch("/api/live-event")
.then(res => res.json())
.then(data => {

let div = document.createElement("div");
div.classList.add("log");

if(data.type === "safe"){
div.classList.add("safe");
div.innerText = "🟢 " + data.time + " - " + data.message;
}else{
div.classList.add("threat");
div.innerText = "🔴 " + data.time + " - " + data.message;
}

document.getElementById("feed").prepend(div);

// update chart randomly
chartData.shift();
chartData.push(chartData[chartData.length-1] + (Math.random()-0.5)*5);

chart.update();

});

}

setInterval(addEvent, 1000);

</script>

</body>
</html>
