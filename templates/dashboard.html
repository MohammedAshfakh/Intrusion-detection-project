<!DOCTYPE html>
<html>
<head>
<title>Security Dashboard</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<nav>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/about">About</a>
<a href="/logout">Logout</a>
</nav>

<div class="container">

<h2>🛡 AI Security Command Center</h2>

<div class="card">

<input id="url" placeholder="Enter website URL">
<button onclick="analyzeURL()">Analyze</button>

<div id="resultText"></div>

</div>

<div class="grid">

<div class="card">
<h3>🔥 Live Feed</h3>
<div id="feed" class="feed"></div>
</div>

<div class="card">
<h3>📊 Risk Graph</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script>

let chart;
let currentURL = "";

// INIT GRAPH
chart = new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:["SAFE","MEDIUM","HIGH"],
datasets:[{
data:[0,0,0],
backgroundColor:["#2ea043","#d29922","#f85149"]
}]
},
options:{
plugins:{legend:{display:false}},
scales:{y:{beginAtZero:true}}
}
});

// RESULT UI
function showResult(data){

let cls = "";

if(data.status==="SAFE") cls="result-safe";
else if(data.status==="MEDIUM RISK") cls="result-medium";
else cls="result-high";

document.getElementById("resultText").innerHTML = `
<div class="result-box">
<h3 class="${cls}">${data.status}</h3>
<p>Risk Score: ${data.score}/100</p>
</div>
`;

}

// ANALYZE URL
function analyzeURL(){

let url = document.getElementById("url").value;

currentURL = url;

fetch("/api/analyze?url=" + encodeURIComponent(url))
.then(res=>res.json())
.then(data=>{

showResult(data);

// update graph
chart.data.datasets[0].data = [
data.score < 30 ? 1 : 0,
data.score >= 30 && data.score < 70 ? 1 : 0,
data.score >= 70 ? 1 : 0
];

chart.update();

});

}

// LIVE FEED
function addEvent(){

if(!currentURL) return;

fetch("/api/live-event")
.then(res=>res.json())
.then(data=>{

let div = document.createElement("div");
div.classList.add("log");

if(data.type==="safe"){
div.classList.add("safe");
}else{
div.classList.add("threat");
}

div.innerText = `[${data.time}] ${data.message} (${data.url})`;

document.getElementById("feed").prepend(div);

});

}

setInterval(addEvent,1000);

</script>

</body>
</html>
