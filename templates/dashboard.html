<!DOCTYPE html>
<html>
<head>
<title>AI SOC Security Center</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:'Segoe UI';
background:#0b0f19;
color:#e6edf3;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#111827;
border-bottom:1px solid #1f2937;
}

nav a{
color:#58a6ff;
text-decoration:none;
margin-right:12px;
font-weight:600;
}

nav a:hover{
color:#2ea043;
}

/* LAYOUT */
.container{
width:95%;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

/* CARD */
.card{
background:#111827;
border:1px solid #1f2937;
padding:20px;
border-radius:12px;
transition:0.3s;
}

.card:hover{
transform:translateY(-3px);
border-color:#58a6ff;
}

/* INPUT */
input{
width:70%;
padding:10px;
border-radius:6px;
border:1px solid #374151;
background:#0b0f19;
color:white;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
background:#238636;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#2ea043;
}

/* FEED */
.feed{
height:320px;
overflow:auto;
background:#0b0f19;
border:1px solid #1f2937;
padding:10px;
border-radius:10px;
}

.log{
padding:8px;
margin:5px 0;
font-size:13px;
border-radius:6px;
}

.safe{background:#052e16;border-left:4px solid #22c55e;}
.threat{background:#3b0a0a;border-left:4px solid #ef4444;}

/* BADGE */
.badge{
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.safe-b{background:#166534;}
.med-b{background:#a16207;}
.high-b{background:#991b1b;}

/* HERO */
.hero{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

/* SCORE */
#score{
font-size:50px;
margin:0;
color:#58a6ff;
}

.small{
font-size:13px;
color:#9ca3af;
}

</style>

</head>

<body>

<!-- NAV -->
<nav>

<div>
<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/scan">Live Scan</a>
<a href="/analytics">Analytics</a>
<a href="/about">About</a>
</div>

</nav>

<div class="container">

<!-- HERO -->
<div class="hero">

<div>
<h2>🛡 AI Security Operations Center</h2>
<p class="small">Real-time Threat Detection Dashboard</p>
</div>

<div>
<h1 id="score">0</h1>
<div id="badge"></div>
</div>

</div>

<!-- INPUT -->
<div class="card">

<h3>🔍 Analyze Website</h3>

<input id="url" placeholder="Enter URL (https://example.com)">
<button onclick="analyze()">Scan</button>

<p id="result"></p>

</div>

<!-- GRID -->
<div class="grid">

<!-- LIVE FEED -->
<div class="card">
<h3>🔥 Live Threat Feed</h3>
<div class="feed" id="feed"></div>
</div>

<!-- CHART -->
<div class="card">
<h3>📊 Threat Score (Per Second)</h3>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script>

let currentURL = "";

/* ================= ANALYZE ================= */
function analyze(){

let url = document.getElementById("url").value;
currentURL = url;

fetch("/api/analyze?url="+encodeURIComponent(url))
.then(r=>r.json())
.then(data=>{

document.getElementById("score").innerText =
    data.score + "%";

/* badge */
let badge = document.getElementById("badge");

let cls = "safe-b";
if(data.status.includes("MEDIUM")) cls="med-b";
if(data.status.includes("ATTACK")) cls="high-b";

badge.innerHTML =
`<span class="badge ${cls}">
${data.status}
</span>`;

let html = "";

if(data.issues && data.issues.length){

    html += "<br><b>Detected Issues:</b><ul>";

    data.issues.forEach(i=>{
        html += `<li>${i}</li>`;
    });

    html += "</ul>";
}

document.getElementById("result").innerHTML = html;

});

}

/* ================= CHART ================= */
let labels = [];
let values = [];

let ctx = document.getElementById("chart").getContext("2d");

let chart = new Chart(ctx, {
type: "line",
data: {
labels: labels,
datasets: [{
label: "Threat Score",
data: values,
borderColor: "#ff4d4d",
tension: 0.3,
fill: false
}]
},
options: {
animation: false,
scales: {
y: { min: 0, max: 100 }
}
}
});

/* ================= LIVE FEED ================= */
function feed(){

if(!currentURL) return;

fetch("/api/live-event")
.then(r=>r.json())
.then(data=>{

let div = document.createElement("div");
div.className = data.message.includes("SQL") || data.message.includes("Brute") ? "log threat" : "log safe";

div.innerText = `[${data.time}] ${data.message}`;

document.getElementById("feed").prepend(div);

});

/* chart update */
let score = Math.floor(Math.random() * 100);

labels.push(new Date().toLocaleTimeString());
values.push(score);

if(labels.length > 20){
labels.shift();
values.shift();
}

chart.update();

}

setInterval(feed, 1000);

</script>

</body>
</html>
