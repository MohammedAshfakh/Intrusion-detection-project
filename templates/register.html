<!DOCTYPE html>
<html>
<head>
<title>Register - Security System</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
margin:0;
font-family:Arial;
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#e6edf3;
}

.card{
background:#161b22;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
width:340px;
text-align:center;
}

h2{
margin-bottom:20px;
color:#58a6ff;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
background:#0d1117;
color:white;
border:1px solid #30363d;
}

button{
width:95%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#238636;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2ea043;
}

a{
color:#58a6ff;
text-decoration:none;
font-size:14px;
}

p{
margin-top:15px;
font-size:14px;
}

small{
color:#8b949e;
}

</style>

</head>

<body>

<div class="card">

<h2>🛡 Create Account</h2>

<form method="POST">

<input name="name" type="text" placeholder="Full Name" required>
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

<p>
Already have an account?
<a href="/login">Login</a>
</p>

<small>
Secure access to AI-powered threat monitoring system
</small>

</div>

</body>
</html>
