<!DOCTYPE html>
<html>
<head>
<title>Login - Security System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">

<style>

body{
margin:0;
font-family:Arial;
background:#0d1117;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#e6edf3;
}

.card{
background:#161b22;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
width:320px;
text-align:center;
}

h2{
margin-bottom:20px;
color:#58a6ff;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
background:#0d1117;
color:white;
border:1px solid #30363d;
}

button{
width:95%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#238636;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2ea043;
}

a{
color:#58a6ff;
text-decoration:none;
font-size:14px;
}
@media(max-width:768px){

nav{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

nav a{
display:inline-block;
margin-bottom:6px;
}

.container{
width:98%;
padding:10px;
}

.grid{
grid-template-columns:1fr !important;
}

.card{
padding:15px;
}

input,
button{
width:100%;
box-sizing:border-box;
margin-top:8px;
}

canvas{
max-width:100%;
height:auto !important;
}

.feed{
height:250px;
}
}

p{
margin-top:15px;
font-size:14px;
}

</style>

</head>

<body>

<div class="card">

<h2>🔐 Secure Login</h2>

<form method="POST">

<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>
Don't have an account?
<a href="/register">Register</a>
</p>

</div>

</body>
</html>
